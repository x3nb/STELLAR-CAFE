<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stella's Comfy Cafe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap');

    /* Basic Reset & Zine Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier Prime', monospace;
      background-color: #0d0a12;
      background-image: 
        radial-gradient(#221338 15%, transparent 16%),
        radial-gradient(#150824 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: #e2d9ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px 100px 10px;
      position: relative;
      overflow-x: hidden;
    }

    /* Zine Wrapper Paper Effect */
    .zine-container {
      width: 100%;
      max-width: 800px;
      background: #140d1f;
      border: 3px solid #6A0DAD;
      box-shadow: 8px 8px 0px #000, -2px -2px 0px #ff0055;
      padding: 20px;
      position: relative;
      transform: rotate(-0.5deg);
    }

    /* Tape decoration */
    .tape {
      position: absolute;
      top: -12px;
      left: 40%;
      width: 120px;
      height: 25px;
      background: rgba(230, 230, 230, 0.2);
      border: 1px dashed rgba(255, 255, 255, 0.4);
      transform: rotate(-3deg);
    }

    /* Banner Section */
    .banner-section {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 2px dashed #6A0DAD;
      padding-bottom: 25px;
    }

    .banner-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      filter: grayscale(40%) contrast(120%) sepia(20%);
      border: 2px solid #fff;
      box-shadow: 5px 5px 0px #6A0DAD;
    }

    /* Social Icons Row */
    .members-overlay {
      margin-top: 15px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .members {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #000;
      padding: 10px 15px;
      border: 2px solid #ff0055;
      transform: rotate(1deg);
    }

    .member-link {
      border: 1px solid #fff;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: all 0.2s ease;
    }

    .member-link:hover {
      transform: scale(1.1) rotate(-3deg);
      background: #ff0055;
    }

    .member-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      filter: grayscale(100%);
    }

    /* Main Typography */
    h1 {
      font-family: 'Special Elite', cursive;
      font-size: 2.5em;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 3px 3px 0px #ff0055, -2px -2px 0px #6A0DAD;
      margin: 20px 0 10px 0;
      text-align: center;
      letter-spacing: 2px;
    }

    p.subtitle {
      font-size: 0.95em;
      color: #bfa8db;
      text-align: center;
      background: #000;
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid #6A0DAD;
      margin-bottom: 15px;
    }

    .cta {
      background: #ff0055;
      color: #fff;
      font-family: 'Special Elite', cursive;
      font-size: 1.1em;
      text-decoration: none;
      padding: 10px 22px;
      border: 2px solid #fff;
      box-shadow: 4px 4px 0px #000;
      display: inline-block;
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cta:hover {
      background: #6A0DAD;
      box-shadow: 2px 2px 0px #fff;
      transform: translate(2px, 2px);
    }

    /* Glassmorphism Side Menu */
    #sideMenu {
      position: fixed;
      top: 20px;
      left: -320px;
      width: 290px;
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(20, 13, 31, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(106, 13, 173, 0.37), inset 0 0 12px rgba(255, 255, 255, 0.05);
      padding: 18px;
      z-index: 10000;
      transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      color: #e2d9ee;
    }

    #sideMenu.active {
      left: 20px;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .menu-title {
      font-family: 'Special Elite', cursive;
      font-size: 1.2em;
      color: #ff0055;
      text-transform: uppercase;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4em;
      cursor: pointer;
      line-height: 1;
    }

    .barista-quote-box {
      background: rgba(106, 13, 173, 0.3);
      border-left: 3px solid #ff0055;
      padding: 8px 10px;
      font-size: 0.78em;
      font-style: italic;
      margin-bottom: 15px;
      border-radius: 0 8px 8px 0;
    }

    .menu-section {
      margin-bottom: 15px;
    }

    .menu-section-title {
      font-size: 0.85em;
      font-weight: bold;
      color: #bfa8db;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .menu-items-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .menu-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.78em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-chip:hover {
      background: #ff0055;
      color: #fff;
      border-color: #fff;
      transform: translateY(-2px);
    }

    #sideMenu::-webkit-scrollbar {
      width: 4px;
    }
    #sideMenu::-webkit-scrollbar-thumb {
      background: rgba(255, 0, 85, 0.5);
      border-radius: 4px;
    }

    /* Chat Box Container */
    #chatContainer {
      position: fixed;
      bottom: 15px;
      right: 15px;
      width: 350px;
      height: 460px;
      background: #0d0914;
      border: 3px solid #fff;
      box-shadow: 6px 6px 0px #ff0055;
      padding: 10px;
      display: flex;
      flex-direction: column;
      z-index: 9999;
    }

    #chatHeader {
      display: flex;
      align-items: center;
      background: #6A0DAD;
      padding: 6px 10px;
      border-bottom: 2px solid #fff;
      cursor: move;
    }

    .icon-svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    #avatar {
      width: 32px;
      height: 32px;
      background: #000;
      border: 1px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    #chatTitle {
      color: #fff;
      font-family: 'Special Elite', cursive;
      font-size: 1.1em;
      letter-spacing: 1px;
    }

    #chatLog {
      flex: 1;
      overflow-y: auto;
      background: #000;
      border: 1px solid #333;
      padding: 10px;
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatLog::-webkit-scrollbar {
      width: 6px;
    }
    #chatLog::-webkit-scrollbar-thumb {
      background: #6A0DAD;
    }

    .message {
      display: flex;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar-img {
      width: 32px;
      height: 32px;
      border: 1px solid #fff;
      margin: 0 6px;
      flex-shrink: 0;
      filter: grayscale(80%);
    }

    .bubble {
      max-width: 75%;
      padding: 8px 10px;
      font-size: 0.85em;
      line-height: 1.3;
      border: 1px solid #fff;
    }

    .message.stella .bubble {
      background: #1e102a;
      color: #e2d9ee;
      border-color: #6A0DAD;
      box-shadow: 2px 2px 0px #000;
    }

    .message.user .bubble {
      background: #ff0055;
      color: #fff;
      border-color: #fff;
      box-shadow: -2px 2px 0px #000;
    }

    .input-wrapper {
      display: flex;
      gap: 5px;
    }

    #userInput {
      flex: 1;
      background: #000;
      color: #fff;
      border: 1px solid #6A0DAD;
      padding: 8px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.85em;
      outline: none;
    }

    #userInput:focus {
      border-color: #ff0055;
    }

    /* Post-it Note Styles */
    .post-it {
      display: none; 
      position: absolute;
      top: -120px; /* Positioned above chat container */
      left: 10px;
      width: 220px;
      background-color: #fffa8d;
      padding: 12px 15px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
      transform: rotate(-3deg);
      font-family: 'Caveat', cursive, sans-serif;
      z-index: 10001;
      border-bottom-right-radius: 12px;
      transition: transform 0.6s ease-in, opacity 0.6s ease-in;
    }

    /* Falling Animation Class */
    .post-it.fall-off {
      transform: translateY(200px) rotate(25deg) !important;
      opacity: 0;
    }

    /* Tape Effect */
    .post-it .tape {
      position: absolute;
      top: -10px;
      left: 35%;
      width: 50px;
      height: 18px;
      background-color: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(0,0,0,0.1);
      transform: rotate(2deg);
    }

    .post-it h3 {
      margin: 5px 0;
      font-size: 1.3rem;
      color: #140d1f;
      text-align: center;
    }

    .handwritten-links {
      list-style: none;
      padding: 0;
      margin: 6px 0;
    }

    .handwritten-links li {
      margin-bottom: 4px;
    }

    .handwritten-links a {
      color: #6A0DAD;
      text-decoration: underline;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .post-it .close-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      color: #ff0055;
      display: block;
      margin: 5px auto 0 auto;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="zine-container">
    <div class="tape"></div>
    <div class="banner-section">
      <img src="https://3society.neocities.org/GUILD/StellasRealmChat/000logo.jpeg" alt="Cafe Banner" class="banner-image" />
      <h1>Stella's Comfy Cafe</h1>
      <p class="subtitle">Indie Vibes • Good Brews • Chill Conversations</p>
      <button class="cta" onclick="toggleMenu()">View Our Menu ☕</button>
    </div>
  </div>

  <div id="sideMenu">
    <div class="menu-header">
      <div class="menu-title">Cafe Menu</div>
      <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>
    <div id="randomQuote" class="barista-quote-box">Loading barista mood...</div>
    
    <div class="menu-section">
      <div class="menu-section-title">Drinks</div>
      <div class="menu-items-grid">
        <span class="menu-chip" onclick="quickSend('Caramel Macchiato')">Caramel Macchiato</span>
        <span class="menu-chip" onclick="quickSend('Chai Latte')">Chai Latte</span>
        <span class="menu-chip" onclick="quickSend('Cold Brew')">Cold Brew</span>
        <span class="menu-chip" onclick="quickSend('Matcha')">Matcha</span>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Pastries</div>
      <div class="menu-items-grid">
        <span class="menu-chip" onclick="quickSend('Donut')">Donut</span>
        <span class="menu-chip" onclick="quickSend('Croissant')">Croissant</span>
      </div>
    </div>
  </div>

  <div id="chatContainer">

    <div id="postItNote" class="post-it">
      <div class="tape"></div>
      <h3>Stell's Map & Links ☕</h3>
      <ul class="handwritten-links">
        <li><a href="https://www.youtube.com" target="_blank">📺 Cafe Ambiance</a></li>
        <li><a href="https://www.amazon.com" target="_blank">📦 Coffee Beans</a></li>
      </ul>
      <button onclick="closePostIt()" class="close-btn">got it!</button>
    </div>

    <div id="chatHeader">
      <div id="avatar">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M2,21V19H20V21H2M20,8V5D20,3.89 19.1,3 18,3H4C2.89,3 2,3.89 2,5V15A3,3 0 0,0 5,18H15A3,3 0 0,0 18,15V13H20A2,2 0 0,0 22,11V10A2,2 0 0,0 20,8M18,11H20V10H18V8H20V10M16,15A1,1 0 0,1 15,16H5A1,1 0 0,1 4,15V5H16V15Z"/></svg>
      </div>
      <div id="chatTitle">Stella's Order Line</div>
    </div>

    <div id="chatLog"></div>

    <div class="input-wrapper">
      <input type="text" id="userInput" placeholder="Order something or speak..." />
    </div>
  </div>

  <script>
    let soundTriggered = false;
    let currentOrder = [];

    // 1. Draggable Chat Box
    const chatContainer = document.getElementById('chatContainer');
    const chatHeader = document.getElementById('chatHeader');
    let isDragging = false, offsetX = 0, offsetY = 0;

    chatHeader.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - chatContainer.offsetLeft;
      offsetY = e.clientY - chatContainer.offsetTop;
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      chatContainer.style.left = `${e.clientX - offsetX}px`;
      chatContainer.style.top = `${e.clientY - offsetY}px`;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      document.body.style.userSelect = '';
    });

    // 2. Barista Quotes & Side Menu Toggle
    const baristaQuotes = [
      "Barista mood: Running on 3 hours of sleep & pure willpower...",
      "Barista mood: My brain feels like an overheated steam wand!",
      "Barista mood: 90% espresso shots, 10% tea leaves, 100% vibe.",
      "Barista mood: Timmy just dropped the mug tray again... send help!",
      "Barista mood: Mental health held together by lavender syrup."
    ];

    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      menu.classList.toggle('active');
      if (menu.classList.contains('active')) {
        const randomQuote = baristaQuotes[Math.floor(Math.random() * baristaQuotes.length)];
        document.getElementById('randomQuote').innerText = randomQuote;
      }
    }

    function quickSend(text) {
      const input = document.getElementById('userInput');
      input.value = text;
      handleUserInput();
    }

    // 3. Sound Effects
    document.addEventListener('click', (e) => {
      if (!soundTriggered && !e.target.classList.contains('cta')) {
        const sound = new Audio('https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Meydan/For_Creators/Meydan_-_08_-_Reflections.mp3');
        sound.play().catch(err => console.log('Autoplay blocked:', err));
        soundTriggered = true;
      }
    });

    const chimeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    chimeSound.volume = 0.3;

    // 4. Responses Object
    const responses = {
      "hello": [
        "Stell's ComfyCafe! Oh—hold on, TIMMY DROP THE STEAM WAND—sorry about that! What can I craft for you today?",
        "Thanks for calling Stell's! *ticket printer buzzing loudly* Oh man, huge rush coming in, but I'm all yours. What are we drinking?",
        "Hey there! Welcome to Stell's. Wait, is that oat milk leaking...? Nevermind! I've got my headset on. What can I get started for you?"
      ],
      "hi": [
        "Hi there! Welcome to Stell's. What can I get brewing for you today?",
        "Hey hey! Catching me between orders—what are we sipping today?",
        "Hi! Hold on—*spills bean hopper*—phew, saved most of 'em! What can I make for ya?"
      ],
      "stella": [
        "That's me! What can I brew up for you today?",
        "Present and accounted for! Well, as present as I can be running on espresso. What's on your mind?",
        "Hey friend! Stella at your service. What are we sipping on?"
      ],
      "stell": [
        "Ooh, I love the nickname! What can I craft for you today?",
        "That's me! Stell on shift, ready to get your cozy drinks rolling. What are you craving?",
        "Hey hey! Stell here—what can I get started for you?"
      ],
      "knock knock": [
        "Who's there?! *peeks over the espresso machine*",
        "Ooh, a joke! Who's there?",
        "Knock knock jokes during a barista shift?! Count me in! Who's there?"
      ],
      "me": [
        "Me who?",
        "Me who?! Don't keep me hanging!",
        "Me who? *stops wiping counter to listen*"
      ],
      "me order another item": [
        "HA! Okay, you got me! 😭 I was fully expecting a bad coffee pun, but respect. What are we adding to the ticket?",
        "*drops Sharpie* NO WAY. You lured me into a knock-knock trap just to order more?! Brilliant. What can I brew up for ya?",
        "BRUH. 💀 You really set me up for that! Point to you. What delicious thing are we slipping onto your tab this time?"
      ],
      "joke": [
        "Why did the coffee file a police report? It got mugged! 😂 Okay okay, tell me yours!",
        "How does a tea bag say hello? 'Nice to tea you!' Haha! Got any good ones for me?"
      ],
      "lol": [
        "Glad I could make you laugh! 😂 What are we sipping on while we giggle?",
        "Haha! Laughing on shift is the best medicine. What can I get for ya?"
      ],
      "haha": [
        "Haha! Love to hear it! 😂 What else can I get going for you today?",
        "Hahaha! You're making this shift so much fun. What are we brewing next?"
      ],
      "xd": [
        "XD Classic! You've got great energy today. What are we ordering next?",
        "Haha XD! Shift duty is 100x better with funny customers!"
      ],
      "perfect": [
        "Perfect indeed! I've got your order all squared away on the ticket. Enjoy your brew!",
        "Awesome! Everything is locked in and sent over to the bar. Have a cozy rest of your day!"
      ],
      "directions": [
        "Oh, looking for directions or external links? I stuck a little post-it note on the counter for you!",
        "Here you go! I popped open our little taped note with all the extra links and directions!"
      ],
      "how are you": [
        "Oh, thank you for asking! I haven't had a break yet today, but we're hanging in there. How are you doing?",
        "Honestly? My mental health is currently held together by espresso shots... but hey, we vibe! How are you?"
      ],
      "donut": [
        "Ooh, a donut! Glazed, chocolate, or jelly?",
        "Donut added to the ticket! Fresh batch came in this morning and they are incredible."
      ],
      "croissant": [
        "Flaky, buttery croissant goodness! Want me to warm it up so it gets extra soft?",
        "Croissant added! Pro tip: dipping a plain croissant into a hot latte is life-changing."
      ],
      "caramel macchiato": [
        "Ooh, caramel macchiato—my absolute favorite to drizzle caramel art onto! Extra drizzle or standard?",
        "Caramel macchiato! Layers of vanilla, silky milk, espresso, and rich caramel. Added!"
      ],
      "chai": [
        "Chai latte! Warm spices, black tea, and creamy milk... it literally tastes like a warm hug.",
        "One spiced Chai Latte locked in! Are we doing oat milk or regular dairy today?"
      ],
      "cold brew": [
        "Cold brew! Steeped for 24 hours so it's super smooth. Want vanilla sweet foam on top?",
        "One draft cold brew coming right up! Perfectly chilled and ready to power your day."
      ],
      "that's all": [
        "Perfect! Ringing that all up now. Your order will be ready at the counter in just a few minutes!",
        "Got it! Tying up your ticket right now. Thanks for hanging out on the line with me!"
      ],
      "thank you": [
        "Aw, absolutely! Happy to help.",
        "You got it! You're super welcome!"
      ],
      "bye": [
        "Bye! Thanks for stopping by Stell's—hope your day is super cozy!",
        "Bye-bye! Don't forget to sip something warm today!"
      ]
    };

    const orderableItems = {
      "caramel macchiato": "Caramel Macchiato",
      "chai": "Chai Latte",
      "cold brew": "Cold Brew",
      "matcha": "Matcha",
      "donut": "Donut",
      "croissant": "Croissant"
    };

    // Aliases
    responses["me who"] = responses["me order another item"];
    responses["me who?"] = responses["me order another item"];
    responses["me order"] = responses["me order another item"];
    responses["lmao"] = responses["lol"];
    responses["ha"] = responses["haha"];
    responses["hahaha"] = responses["haha"];
    responses["xdd"] = responses["xd"];
    responses["sounds perfect"] = responses["perfect"];
    responses["sounds good"] = responses["perfect"];
    responses["thats all"] = responses["that's all"];
    responses["map"] = responses["directions"];
    responses["links"] = responses["directions"];
    responses["where are you"] = responses["directions"];
    responses["youtube"] = responses["directions"];
    responses["amazon"] = responses["directions"];
    responses["thanks"] = responses["thank you"];
    responses["bye-bye"] = responses["bye"];

    // Append Message
    function appendMessage(sender, message) {
      const chatLog = document.getElementById('chatLog');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + (sender === 'You' ? 'user' : 'stella');

      const avatarImg = document.createElement('img');
      avatarImg.className = 'avatar-img';
      avatarImg.src = sender === 'You' 
        ? 'https://3society.neocities.org/GUILD/tcup.jpeg' 
        : 'https://3society.neocities.org/GUILD/StellasRealmChat/000logo.jpeg';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = message;

      if (sender === 'You') {
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(avatarImg);
      } else {
        msgDiv.appendChild(avatarImg);
        msgDiv.appendChild(bubble);
      }

      chatLog.appendChild(msgDiv);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    const lastResponseIndex = {};
    function getRandomResponse(key, arr) {
      if (arr.length === 1) return arr[0];
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * arr.length);
      } while (newIndex === lastResponseIndex[key]);
      lastResponseIndex[key] = newIndex;
      return arr[newIndex];
    }

    // Input Processing
    function handleUserInput() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;

      appendMessage('You', msg);
      input.value = '';

      const lowerMsg = msg.toLowerCase();

      // Check for Order Items
      for (const itemKey in orderableItems) {
        if (lowerMsg.includes(itemKey)) {
          const itemName = orderableItems[itemKey];
          if (!currentOrder.includes(itemName)) {
            currentOrder.push(itemName);
          }
        }
      }

      // Check Post-It Trigger
      const mapTriggers = ["directions", "map", "links", "where are you", "youtube", "amazon"];
      if (mapTriggers.some(trigger => lowerMsg.includes(trigger))) {
        togglePostIt();
      }

      // Match Response
      let replyArray = null;
      let matchedKey = 'default';

      if (responses.hasOwnProperty(lowerMsg)) {
        replyArray = responses[lowerMsg];
        matchedKey = lowerMsg;
      } else {
        for (const key in responses) {
          if (key !== 'default' && lowerMsg.includes(key)) {
            replyArray = responses[key];
            matchedKey = key;
            break;
          }
        }
      }

      // Fallback
      if (!replyArray) {
        replyArray = [
          "Hmm, I don't think we have that on the board today! I opened up our menu so you can check out what's brewing.",
          "Ooh, that's off-menu for us! Take a peek at our menu on the side to see what we've got in stock today."
        ];
        matchedKey = 'default';

        const menu = document.getElementById('sideMenu');
        if (!menu.classList.contains('active')) {
          toggleMenu();
        }
      }

      const reply = getRandomResponse(matchedKey, replyArray);

      setTimeout(() => {
        appendMessage('Stella', reply);
        chimeSound.currentTime = 0;
        chimeSound.play().catch(e => console.log('Audio playback prevented:', e));
      }, 600);
    }

    // Post-It Logic
    let postItTimer = null;

    function togglePostIt() {
      const postIt = document.getElementById('postItNote');
      if (postItTimer) clearTimeout(postItTimer);

      if (postIt.style.display === 'block' && !postIt.classList.contains('fall-off')) {
        closePostIt();
        return;
      }

      postIt.classList.remove('fall-off');
      postIt.style.display = 'block';

      postItTimer = setTimeout(() => {
        fallOffPostIt();
      }, 9000);
    }

    function fallOffPostIt() {
      const postIt = document.getElementById('postItNote');
      postIt.classList.add('fall-off');
      setTimeout(() => {
        postIt.style.display = 'none';
        postIt.classList.remove('fall-off');
      }, 600);
    }

    function closePostIt() {
      const postIt = document.getElementById('postItNote');
      if (postItTimer) clearTimeout(postItTimer);
      postIt.style.display = 'none';
      postIt.classList.remove('fall-off');
    }

    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });
  </script>
</body>
